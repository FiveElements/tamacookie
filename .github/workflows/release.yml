name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.2.0) — crée le tag v<version>"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # versionCode croissant : nombre de commits + numéro de run
          echo "code=$(( $(git rev-list --count HEAD 2>/dev/null || echo 0) + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.TAMACOOKIE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TAMACOOKIE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune clé de release configurée : l'APK sera signé avec une clé de debug."
          fi

      - name: APK release
        env:
          TAMACOOKIE_KEYSTORE_PASSWORD: ${{ secrets.TAMACOOKIE_KEYSTORE_PASSWORD }}
          TAMACOOKIE_KEY_ALIAS: ${{ secrets.TAMACOOKIE_KEY_ALIAS }}
          TAMACOOKIE_KEY_PASSWORD: ${{ secrets.TAMACOOKIE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/tamacookie-${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publication GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TamaCookie ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
