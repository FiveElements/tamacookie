# Critères de la JVM du démon Gradle (https://docs.gradle.org/current/userguide/gradle_daemon.html#sec:daemon_jvm_criteria) :
# JDK 21, quel que soit JAVA_HOME (lintDebug plante avec le JDK 25 : UastFacade). Écrit à la main, sans URL de
# téléchargement : `updateDaemonJvm` exige un résolveur de toolchains (plugin foojay), non ajouté. Le JDK 21 doit
# être installé et détecté : JAVA_HOME, ou JDK21_HOME / JAVA_HOME_21_X64 (gradle.properties), ou
# org.gradle.java.installations.paths dans ~/.gradle/gradle.properties.
toolchainVersion=21
